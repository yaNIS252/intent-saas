<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Client — Intent SaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #030712;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.18), transparent),
        radial-gradient(ellipse 60% 40% at 100% 50%, rgba(139, 92, 246, 0.08), transparent),
        radial-gradient(ellipse 50% 30% at 0% 80%, rgba(59, 130, 246, 0.06), transparent);
    }
    .glass-strong {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="font-sans text-slate-300 antialiased min-h-screen flex flex-col">
  
  <!-- Header (Bouton déconnexion masqué si non connecté) -->
  <header class="bg-gray-800/50 backdrop-blur-sm border-b border-white/5 px-6 py-4">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <span class="text-white font-semibold text-lg">Espace Client IntentPulse</span>
      </div>
      <button id="btnLogout" class="hidden px-3 py-1 bg-red-600 hover:bg-red-700 text-sm font-medium rounded-lg transition">Déconnexion</button>
    </div>
  </header>

  <main class="flex-1 flex flex-col items-center justify-center py-8 px-4">
    
    <!-- CONTENEUR AUTHENTIFICATION -->
    <div id="authContainer" class="w-full max-w-md space-y-6 glass-strong p-8 rounded-2xl">
      
      <!-- Selecteur de Mode -->
      <div class="flex bg-gray-900/60 p-1 rounded-xl border border-white/5">
        <button id="btnShowLogin" class="flex-1 py-2 text-sm font-medium rounded-lg transition">Connexion</button>
        <button id="btnShowSignup" class="flex-1 py-2 text-sm font-medium rounded-lg transition">Inscription</button>
      </div>

      <!-- Formulaire Connexion -->
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1">E-mail</label>
          <input type="email" id="loginEmail" required placeholder="nom@entreprise.com"
            class="w-full px-4 py-2 bg-gray-800/80 border border-gray-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1">Mot de passe</label>
          <input type="password" id="loginPassword" required placeholder="••••••••"
            class="w-full px-4 py-2 bg-gray-800/80 border border-gray-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white">
        </div>
        <button type="submit" class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg transition shadow-lg shadow-indigo-600/30">
          Se connecter
        </button>
      </form>

      <!-- Formulaire Inscription -->
      <form id="signupForm" class="space-y-4 hidden">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1">E-mail</label>
          <input type="email" id="signupEmail" required placeholder="nom@entreprise.com"
            class="w-full px-4 py-2 bg-gray-800/80 border border-gray-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1">Mot de passe (6 caractères min)</label>
          <input type="password" id="signupPassword" required placeholder="••••••••"
            class="w-full px-4 py-2 bg-gray-800/80 border border-gray-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white">
        </div>
        <button type="submit" class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg transition shadow-lg shadow-indigo-600/30">
          Créer un compte
        </button>
      </form>

      <div id="authMessage" class="hidden p-3 text-sm rounded-lg border"></div>
    </div>

    <!-- CONTENEUR DASHBOARD -->
    <div id="dashboardContainer" class="hidden w-full max-w-4xl space-y-8">
      
      <!-- Info Utilisateur -->
      <div class="flex justify-between items-center bg-gray-800/50 backdrop-blur-sm rounded-xl p-4 border border-white/5">
        <div>
          <p id="userEmail" class="text-sm text-slate-400">Chargement…</p>
          <p id="userName" class="font-semibold text-white"></p>
        </div>
        <button id="btnRefresh" class="px-3 py-1 bg-gray-700 hover:bg-gray-600 text-sm rounded transition">Actualiser</button>
      </div>

      <div id="dashboardMessage" class="hidden p-3 text-sm rounded-lg border"></div>

      <!-- Config Tracker -->
      <section class="glass-strong rounded-xl p-6 space-y-4">
        <h2 class="text-xl font-semibold border-b border-gray-700 pb-2">1. Configuration du tracker</h2>
        
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1">ID de votre site</label>
          <input type="text" id="siteId" readonly class="w-full px-4 py-2 bg-gray-900/80 border border-gray-700 rounded-lg text-slate-400 font-mono">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1">Mots-clés d'intention (séparés par des virgules)</label>
          <input type="text" id="keywordsInput" placeholder="pricing, tarifs, devis, contact"
            class="w-full px-4 py-2 bg-gray-800/80 border border-gray-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1">URL Webhook Slack</label>
          <input type="url" id="webhookInput" placeholder="https://hooks.slack.com/services/..."
            class="w-full px-4 py-2 bg-gray-800/80 border border-gray-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white">
        </div>

        <button id="btnSaveConfig" class="w-full py-2 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg transition">
          Enregistrer la configuration
        </button>

        <div class="mt-4 p-3 bg-gray-950/80 rounded-lg font-mono text-sm text-green-400 border border-white/5 overflow-x-auto">
          <pre id="scriptSnippet">// Script à copier dans le &lt;head&gt; de votre site</pre>
        </div>
      </section>

      <!-- Historique Leads -->
      <section class="glass-strong rounded-xl p-6">
        <h2 class="text-xl font-semibold mb-4 border-b border-gray-700 pb-2">2. Historique des leads B2B</h2>
        <div id="leadsTableWrapper" class="overflow-x-auto">
          <table class="min-w-full bg-gray-900/50 rounded-lg overflow-hidden">
            <thead>
              <tr class="text-left text-xs font-medium text-slate-400 bg-gray-800/50 border-b border-gray-700">
                <th class="py-3 px-4">Entreprise</th>
                <th class="py-3 px-4">Localisation</th>
                <th class="py-3 px-4">Page visitée</th>
                <th class="py-3 px-4">Referrer</th>
                <th class="py-3 px-4">Date</th>
              </tr>
            </thead>
            <tbody id="leadsTableBody"></tbody>
          </table>
        </div>
        <p id="leadsEmpty" class="mt-4 text-slate-400 text-center py-4">Aucun lead détecté pour le moment.</p>
      </section>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://vudtgpdsufkqpssgnqdr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ1ZHRncGRzdWZrcXBzc2ducWRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNzYzODcsImV4cCI6MjEwMDY1MjM4NzB9";
    
    let supabase = null;
    if (window.supabase) {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    const authContainer = document.getElementById('authContainer');
    const dashboardContainer = document.getElementById('dashboardContainer');
    const authMessage = document.getElementById('authMessage');
    const dashboardMessage = document.getElementById('dashboardMessage');
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    const btnShowLogin = document.getElementById('btnShowLogin');
    const btnShowSignup = document.getElementById('btnShowSignup');
    const btnLogout = document.getElementById('btnLogout');

    let currentUser = null;
    let currentClient = null;

    function showAuthMessage(text, isError = true) {
      authMessage.textContent = text;
      authMessage.className = `p-3 text-sm rounded-lg ${isError ? 'bg-red-900/50 text-red-300 border-red-800' : 'bg-green-900/50 text-green-300 border-green-800'}`;
      authMessage.classList.remove('hidden');
    }

    function showDashboardMessage(text, isError = true) {
      dashboardMessage.textContent = text;
      dashboardMessage.className = `p-3 text-sm rounded-lg ${isError ? 'bg-red-900/50 text-red-300 border-red-800' : 'bg-green-900/50 text-green-300 border-green-800'}`;
      dashboardMessage.classList.remove('hidden');
    }

    function showLoginForm() {
      loginForm.classList.remove('hidden');
      signupForm.classList.add('hidden');
      btnShowLogin.className = "flex-1 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white transition shadow";
      btnShowSignup.className = "flex-1 py-2 text-sm font-medium rounded-lg text-slate-400 hover:text-white transition";
    }

    function showSignupForm() {
      signupForm.classList.remove('hidden');
      loginForm.classList.add('hidden');
      btnShowSignup.className = "flex-1 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white transition shadow";
      btnShowLogin.className = "flex-1 py-2 text-sm font-medium rounded-lg text-slate-400 hover:text-white transition";
    }

    btnShowLogin.addEventListener('click', showLoginForm);
    btnShowSignup.addEventListener('click', showSignupForm);

    // Initialisation du mode selon l'URL (?mode=signup ou ?mode=login)
    function initAuthMode() {
      const mode = new URLSearchParams(window.location.search).get('mode');
      if (mode === 'signup') {
        showSignupForm();
      } else {
        showLoginForm();
      }
    }

    // Soumission Connexion
    loginForm.addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      
      try {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        showAuthMessage('Connexion réussie...', false);
        checkSession();
      } catch (err) {
        showAuthMessage(err.message, true);
      }
    });

    // Soumission Inscription
    signupForm.addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;

      try {
        const resp = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const result = await resp.json();
        if (!resp.ok) throw new Error(result.error || 'Erreur lors de l\'inscription');

        const { error: loginErr } = await supabase.auth.signInWithPassword({ email, password });
        if (loginErr) {
          showAuthMessage('Compte créé ! Veuillez vous connecter.', false);
          showLoginForm();
        } else {
          checkSession();
        }
      } catch (err) {
        showAuthMessage(err.message, true);
      }
    });

    // Déconnexion
    btnLogout.addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = '/app.html?mode=login';
    });

    // Vérification de Session
    async function checkSession() {
      if (!supabase) return;

      const { data: { session } } = await supabase.auth.getSession();

      if (!session) {
        // Mode Déconnecté
        authContainer.classList.remove('hidden');
        dashboardContainer.classList.add('hidden');
        btnLogout.classList.add('hidden');
        initAuthMode();
        return;
      }

      // Mode Connecté
      currentUser = session.user;
      authContainer.classList.add('hidden');
      dashboardContainer.classList.remove('hidden');
      btnLogout.classList.remove('hidden');

      document.getElementById('userEmail').textContent = currentUser.email;

      try {
        const resp = await fetch('/api/client/me', {
          headers: { 'Authorization': `Bearer ${session.access_token}` }
        });
        const data = await resp.json();
        if (!resp.ok || !data.success) throw new Error(data.error || 'Erreur chargement client');

        currentClient = data.client;
        document.getElementById('userName').textContent = currentClient.name || 'Client';
        document.getElementById('siteId').value = currentClient.site_id || '—';
        document.getElementById('keywordsInput').value = (currentClient.intent_keywords || []).join(', ');
        document.getElementById('webhookInput').value = currentClient.slack_webhook_url || '';

        const host = window.location.origin;
        document.getElementById('scriptSnippet').textContent = `<script src="${host}/tracker.js" data-site-id="${currentClient.site_id}" async><` + `/script>`;

        loadLeads(session.access_token);
      } catch (err) {
        showDashboardMessage(err.message, true);
      }
    }

    async function loadLeads(token) {
      const tbody = document.getElementById('leadsTableBody');
      const emptyMsg = document.getElementById('leadsEmpty');
      tbody.innerHTML = '';

      try {
        const resp = await fetch('/api/leads', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await resp.json();
        const leads = data.leads || [];

        if (leads.length === 0) {
          emptyMsg.classList.remove('hidden');
          return;
        }

        emptyMsg.classList.add('hidden');
        leads.forEach(lead => {
          const tr = document.createElement('tr');
          tr.className = 'border-b border-gray-800 hover:bg-gray-800/30 text-sm';
          tr.innerHTML = `
            <td class="py-3 px-4 font-medium text-white">${lead.company_name || 'Non identifié'}</td>
            <td class="py-3 px-4 text-slate-400">${lead.location || '—'}</td>
            <td class="py-3 px-4 text-slate-300 font-mono text-xs">${lead.page_url || '/'}</td>
            <td class="py-3 px-4 text-slate-400">${lead.referrer || 'Direct'}</td>
            <td class="py-3 px-4 text-slate-400 text-xs">${new Date(lead.created_at).toLocaleString('fr-FR')}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        showDashboardMessage('Erreur chargement leads : ' + err.message, true);
      }
    }

    // Sauvegarde Config
    document.getElementById('btnSaveConfig').addEventListener('click', async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return;

      const keywords = document.getElementById('keywordsInput').value.split(',').map(k => k.trim()).filter(Boolean);
      const webhook = document.getElementById('webhookInput').value.trim();

      try {
        const resp = await fetch('/api/client/config', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.access_token}`
          },
          body: JSON.stringify({ intent_keywords: keywords, slack_webhook_url: webhook })
        });
        const data = await resp.json();
        if (!resp.ok || !data.success) throw new Error(data.error);

        showDashboardMessage('Configuration sauvegardée avec succès !', false);
      } catch (err) {
        showDashboardMessage(err.message, true);
      }
    });

    document.getElementById('btnRefresh').addEventListener('click', checkSession);

    // Démarrage
    window.addEventListener('DOMContentLoaded', checkSession);
  </script>
</body>
</html>
